### ekf_localization_node Parameters ###
ukf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Sensor 1: Wheel Odometry
    odom0: /odom
    odom0_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 5
    odom0_pose_relative_to_covariance: false
    odom0_differential: false

    # Sensor 2: IMU
    imu0: /imu
    imu0_config: [false, false, false,
                      true,  true,  true,
                      false, false, false,
                      true,  true,  true,
                      true,  true,  true]
    imu0_queue_size: 10
    imu0_pose_relative_to_covariance: false
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
